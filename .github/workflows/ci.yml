name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  ci:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      
      - name: Build and Test
        uses: ./.github/actions/build-and-test
        with:
          configuration: Release
          upload-analyzer-results: true
          project: XrmSync.slnx
